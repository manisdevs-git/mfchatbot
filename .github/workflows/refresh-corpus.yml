name: Refresh Groww corpus

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate a new corpus without replacing git files
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * 1"

concurrency:
  group: refresh-corpus
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Fetch, chunk, embed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANONYMIZED_TELEMETRY: "False"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache MiniLM weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-minilm-${{ hashFiles('requirements.txt') }}

      - name: Install ingest dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild corpus from corpus_manifest.json
        run: python -m ingest.refresh_corpus ${{ github.event.inputs.dry_run == 'true' && '--dry-run --keep-staging' || '' }}

      - name: Commit processed corpus
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus_manifest.json data/processed
          if git diff --cached --quiet; then
            echo "Corpus files are unchanged."
            exit 0
          fi
          git commit -m "Refresh Groww corpus from corpus_manifest."
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
